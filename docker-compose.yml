services:
  http:
    image: nginx:1.25
    restart: always
    ports:
      - '80:80'
    volumes:
      - './:/app/'
      - './docker/nginx/nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
      - php
  php:
    build:
      context: ./docker/php/
      dockerfile: prod.Dockerfile
    restart: always
    volumes:
      - ./:/app/
    working_dir: /app/
    depends_on:
      - pgsql
  node:
    image: node:20
    volumes:
      - ./:/app/
    working_dir: /app/
    command: "npm run build"
